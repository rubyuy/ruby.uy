<!doctype html>
<!-- Source for assets/images/og.png (1200x630). Regenerate:
     agent_browser: args ["set","viewport","1200","630"], open file://.../og.html, screenshot ".og" assets/images/og.png -->
<html lang="es">
<head>
  <meta charset="utf-8">
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,500;9..40,700&family=Syncopate:wght@700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 1200px; height: 630px; overflow: hidden; }

    .og {
      position: relative;
      width: 1200px;
      height: 630px;
      background: #3967D1;
      color: #fff;
      font-family: "DM Sans", system-ui, sans-serif;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }

    /* flat structural rules, no gradients */
    .og::before {
      content: "";
      position: absolute;
      inset: 0 0 auto 0;
      height: 14px;
      background: #FFC24D;
    }

    .og__top {
      position: relative;
      flex: 1;
      padding: 52px 64px 0;
      display: flex;
      flex-direction: column;
    }

    .og__brand {
      position: relative;
      display: flex;
      align-items: center;
      gap: 16px;
    }
    .og__mark { width: 62px; height: 53px; filter: drop-shadow(4px 4px 0 #2E2E2E); }
    .og__sun {
      position: absolute;
      right: 24px;
      top: 104px;
      width: 212px;
      height: 180px;
      filter: drop-shadow(8px 8px 0 #2E2E2E);
    }
    .og__wordmark {
      font-family: Syncopate, sans-serif;
      font-weight: 700;
      font-size: 34px;
      letter-spacing: 0.02em;
      color: #fff;
    }
    .og__wordmark span { color: #FFC24D; }
    .og__kicker {
      margin-left: auto;
      font-family: Syncopate, sans-serif;
      font-weight: 700;
      font-size: 15px;
      letter-spacing: 0.18em;
      color: #ABC2FB;
      text-transform: uppercase;
    }

    .og__body { position: relative; margin: auto 0; }
    .og__title {
      font-family: Syncopate, sans-serif;
      font-weight: 700;
      font-size: 98px;
      line-height: 1;
      letter-spacing: -0.02em;
      color: #FFC24D;
      text-shadow: 6px 6px 0 #2E2E2E;
    }
    .og__title em { font-style: normal; color: #fff; }

    .og__band {
      border-top: 3px solid #2E2E2E;
      background: #F6EEEC;
      color: #2E2E2E;
      padding: 34px 64px;
      display: flex;
      align-items: center;
      gap: 32px;
    }
    .og__pill {
      flex: none;
      background: #FFC24D;
      color: #2E2E2E;
      font-family: Syncopate, sans-serif;
      font-weight: 700;
      font-size: 22px;
      padding: 16px 32px;
      border: 3px solid #2E2E2E;
      border-radius: 999px;
      box-shadow: 5px 5px 0 #2E2E2E;
    }
    .og__lead {
      font-size: 25px;
      line-height: 1.35;
      font-weight: 500;
      max-width: 640px;
      color: #2E2E2E;
    }
    .og__meta {
      margin-left: auto;
      text-align: right;
      font-family: Syncopate, sans-serif;
      font-weight: 700;
      font-size: 14px;
      line-height: 1.7;
      letter-spacing: 0.16em;
      text-transform: uppercase;
      color: rgba(46, 46, 46, 0.7);
    }
  </style>
</head>
<body>
  <div class="og">
    <div class="og__top">
      <div class="og__brand">
        <img class="og__mark" src="../assets/images/logo.svg" alt="">
        <div class="og__wordmark">RUBY<span>.</span>UY</div>
        <div class="og__kicker">Meetups · Charlas · Open source</div>
      </div>

      <div class="og__body">
        <h1 class="og__title">COMUNIDAD<br><em>RUBY</em> URUGUAY</h1>
      </div>
      <img class="og__sun" src="../assets/images/logo.svg" alt="">
    </div>

    <div class="og__band">
      <div class="og__pill">ruby.uy</div>
      <p class="og__lead">Meetups, charlas y open source de la comunidad Ruby y Rails en Uruguay desde 2012.</p>
      <div class="og__meta">Montevideo<br>Uruguay</div>
    </div>
  </div>
</body>
</html>
