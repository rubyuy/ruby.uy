on:
  push:
  pull_request_target:
    types: [opened, synchronize, reopened]

jobs:
  deploy:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      deployments: write
      pull-requests: write

    name: Deploy to Cloudflare Pages

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          # Latest 3.2.x: ubuntu-latest (now 26.04) only ships the newest patch
          # of each series, so pinning 3.2.2 via .ruby-version breaks the build.
          ruby-version: '3.2'
          bundler-cache: true

      - name: Build the website
        run: bundle exec jekyll build
        env:
          JEKYLL_ENV: production

      - name: Publish
        id: cloudflare
        uses: cloudflare/wrangler-action@v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
          wranglerVersion: '4'
          command: pages deploy _site --project-name=ruby-uy --branch=${{ github.event.pull_request.head.ref || github.ref_name }}

      - name: Comment preview URL on PR
        if: github.event_name == 'pull_request_target'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body: `🔍 Preview: ${process.env.DEPLOY_URL}`
            })
        env:
          DEPLOY_URL: ${{ steps.cloudflare.outputs.deployment-url }}
