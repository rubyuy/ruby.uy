<header class="site-nav" data-nav>
  <a class="skip-link" href="#main">Saltar al contenido</a>

  <div class="site-nav__inner">
    <a class="site-nav__brand" href="/" aria-label="Ruby UY — Inicio">
      <img class="site-nav__mark" src="/assets/images/logo.svg" alt="" aria-hidden="true" width="41" height="30">
      <span class="site-nav__wordmark">RUBY<span class="site-nav__wordmark-dot" aria-hidden="true">.</span>UY</span>
    </a>

    <button class="site-nav__toggle" type="button" data-nav-toggle aria-expanded="false" aria-controls="site-nav-menu" aria-label="Abrir menú">
      <span class="site-nav__toggle-label">Menú</span>
      <span class="site-nav__toggle-icon" aria-hidden="true"><i></i><i></i></span>
    </button>

    <nav class="site-nav__menu" id="site-nav-menu" data-nav-menu aria-label="Navegación principal">
      <ul class="site-nav__links">
        <li><a href="/#meetups">Meetups</a></li>
        <li><a href="/charlas/">Charlas</a></li>
        <li><a href="/community/">Community</a></li>
        <li><a href="/stats/">Stats</a></li>
        <li><a href="/primera-vez/">Primera vez</a></li>
      </ul>

      {% assign upcoming = site.data.next_meetup %}
      {% assign today = site.time | date: "%Y-%m-%d" %}
      {% if upcoming.show and upcoming.date_iso >= today %}
        <a class="site-nav__cta" href="/#meetup">
          Próxima meetup
          <img src="/assets/images/arrow.svg" alt="" aria-hidden="true" width="20" height="18">
        </a>
      {% endif %}
    </nav>
  </div>
</header>
